name: Refresh outage feed

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "5-55/10 * * * *"
    - cron: "2-52/10 * * * *"
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-outages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Scrape all distributors
        working-directory: scripts
        run: python scrape_all.py
      - name: Commit data
        run: |
          git config user.name "nexus-outage-bot"
          git config user.email "bot@nexusenergy.au"
          git add docs/data/outages.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git push
          fi
