name: Refresh outage feed

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-outages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Scrape all distributors
        working-directory: scripts
        run: python scrape_all.py
      - name: Commit data
        run: |
          git config user.name  "nexus-outage-bot"
          git config user.email "bot@nexusenergy.au"
          git add docs/data/outages.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%FT%TZ)"

          # Push with retry to survive transient GitHub 5xx and races
          # with other scheduled runs (rebase if main moved underneath us).
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 5 attempts"
          exit 1
